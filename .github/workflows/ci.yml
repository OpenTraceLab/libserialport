name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2022
            platform: windows-mingw
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            $HOME/.cache/ccache
            $HOME/.cache/meson
          key: linux-${{ hashFiles('**/meson.build','**/meson_options.txt') }}
          restore-keys: linux-

      - name: Cache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            $HOME/.cache/ccache
            $HOME/.cache/meson
          key: mac-${{ hashFiles('**/meson.build','**/meson_options.txt') }}
          restore-keys: mac-

      - name: Cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.ccache
            C:\Users\runneradmin\AppData\Local\meson
          key: win-${{ hashFiles('**/meson.build','**/meson_options.txt') }}
          restore-keys: win-

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config gcc ccache
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.cache/ccache" "$HOME/.cache/meson"

      - name: macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja pkg-config ccache
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"
          echo "XDG_CACHE_HOME=$HOME/.cache" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/ccache" "$HOME/.cache/meson"

      - name: MSYS2 setup (MinGW)
        if: matrix.platform == 'windows-mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-pkg-config

      - name: Build & test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          meson setup build --buildtype=release
          meson compile -C build
          meson test -C build --print-errorlogs

      - name: Build & test (Windows MinGW)
        if: matrix.platform == 'windows-mingw'
        shell: msys2 {0}
        run: |
          export CCACHE_DIR=/c/Users/runneradmin/.ccache
          export XDG_CACHE_HOME=/c/Users/runneradmin/AppData/Local
          mkdir -p "$CCACHE_DIR"
          meson setup build --buildtype=release
          meson compile -C build
          meson test -C build --print-errorlogs

      - name: Install (Linux/macOS)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        run: |
          DESTDIR="${PWD}/install" meson install -C build
          cd install
          INSTALL_ROOT=$(find . -type d -name include | head -1 | sed 's|/include$||')
          tar czf ../libserialport-${{ matrix.platform }}.tar.gz -C $INSTALL_ROOT .

      - name: Install (Windows MinGW)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-mingw'
        shell: msys2 {0}
        run: |
          DESTDIR="${PWD}/install" meson install -C build
          cd install
          INSTALL_ROOT=$(find . -type d -name mingw64 | head -1)
          tar czf ../libserialport-${{ matrix.platform }}.tar.gz -C $INSTALL_ROOT .

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: libserialport-${{ matrix.platform }}
          path: libserialport-*.tar.gz

  build-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python & Meson
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Build (MSVC static /MD)
        shell: pwsh
        run: |
          meson setup build --buildtype=release -Db_vscrt=md
          meson compile -C build
          meson test -C build --print-errorlogs

      - name: Install
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          meson install -C build --destdir="$pwd\install"
          $installRoot = (Get-ChildItem -Path install -Recurse -Directory -Filter include | Select-Object -First 1).Parent.FullName
          tar czf libserialport-windows-msvc.tar.gz -C $installRoot bin include lib

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: libserialport-windows-msvc
          path: libserialport-*.tar.gz

  release:
    needs: [build, build-msvc]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/libserialport-*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
